---
# health_check.yml
#
# A realistic AIOps-shaped test: gather basic system health and return it as
# structured job artifacts, so the agent gets usable data rather than raw
# playbook output. Also sets a pass/fail verdict the agent can reason about.
#
# AWX setup:
#   Job Template -> check "Prompt on launch" for Variables
#
# Optional extra_vars:
#   {"disk_warn_percent": 80, "mem_warn_percent": 90}

- name: Collect system health and return it as job artifacts
  hosts: all
  gather_facts: true
  connection: local

  vars:
    disk_warn_percent: 85
    mem_warn_percent: 90

  tasks:
    - name: Compute root filesystem usage
      ansible.builtin.set_fact:
        root_mount: >-
          {{ ansible_mounts | selectattr('mount', 'equalto', '/') | first }}

    - name: Derive usage percentages
      ansible.builtin.set_fact:
        disk_used_percent: >-
          {{ (((root_mount.size_total - root_mount.size_available)
               / root_mount.size_total) * 100) | round(1) }}
        mem_used_percent: >-
          {{ (((ansible_memtotal_mb - ansible_memfree_mb)
               / ansible_memtotal_mb) * 100) | round(1) }}

    - name: Determine verdict
      ansible.builtin.set_fact:
        health_verdict: >-
          {{ 'warn'
             if (disk_used_percent | float > disk_warn_percent | float
                 or mem_used_percent | float > mem_warn_percent | float)
             else 'ok' }}

    - name: Report to the job log
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} is {{ health_verdict }} —
          disk {{ disk_used_percent }}%, memory {{ mem_used_percent }}%

    - name: Return structured health data as job artifacts
      ansible.builtin.set_stats:
        data:
          hostname: "{{ ansible_hostname }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          uptime_seconds: "{{ ansible_uptime_seconds | default('unknown') }}"
          cpu_cores: "{{ ansible_processor_vcpus }}"
          memory_total_mb: "{{ ansible_memtotal_mb }}"
          memory_used_percent: "{{ mem_used_percent }}"
          disk_total_gb: "{{ (root_mount.size_total / 1073741824) | round(1) }}"
          disk_used_percent: "{{ disk_used_percent }}"
          health_verdict: "{{ health_verdict }}"
        aggregate: false
