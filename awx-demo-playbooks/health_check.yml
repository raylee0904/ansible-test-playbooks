---
# health_check.yml
#
# Collects basic system health and returns it as structured job artifacts,
# plus a pass/fail verdict the agent can reason about.
#
# NOTE ON WHAT IS MEASURED
# With connection: local, AWX runs this inside its execution environment
# container. Disk figures therefore describe the filesystem the EE sees, not
# necessarily the EC2 host's root volume. Fine for a demo; for real host
# metrics, target the host over SSH with a proper inventory and credential.
#
# Uses `df` rather than ansible_mounts: the mount list inside a container has
# no '/' entry, which makes selectattr('mount','equalto','/') return an empty
# sequence and abort the play.
#
# AWX setup:
#   Job Template -> tick "Prompt on launch" next to Variables
#
# Optional extra_vars:
#   {"disk_warn_percent": 80, "mem_warn_percent": 90}

- name: Collect system health and return it as job artifacts
  hosts: all
  gather_facts: true
  connection: local

  vars:
    disk_warn_percent: 85
    mem_warn_percent: 90
    check_path: "/"

  tasks:
    - name: Read filesystem usage
      ansible.builtin.command:
        cmd: "df -Pk {{ check_path }}"
      register: df_result
      changed_when: false

    - name: Parse df output
      ansible.builtin.set_fact:
        df_fields: "{{ df_result.stdout_lines[1].split() }}"

    - name: Derive disk figures
      ansible.builtin.set_fact:
        filesystem: "{{ df_fields[0] }}"
        disk_total_gb: "{{ (df_fields[1] | int / 1048576) | round(1) }}"
        disk_free_gb: "{{ (df_fields[3] | int / 1048576) | round(1) }}"
        disk_used_percent: "{{ df_fields[4] | regex_replace('%', '') | float }}"

    - name: Derive memory usage
      ansible.builtin.set_fact:
        mem_used_percent: >-
          {{ (((ansible_memtotal_mb - ansible_memfree_mb)
               / ansible_memtotal_mb) * 100) | round(1) }}

    - name: Determine verdict
      ansible.builtin.set_fact:
        health_verdict: >-
          {{ 'warn'
             if (disk_used_percent | float > disk_warn_percent | float
                 or mem_used_percent | float > mem_warn_percent | float)
             else 'ok' }}

    - name: Report to the job log
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} is {{ health_verdict }} --
          disk {{ disk_used_percent }}% of {{ disk_total_gb }}GB,
          memory {{ mem_used_percent }}%

    - name: Return structured health data as job artifacts
      ansible.builtin.set_stats:
        data:
          hostname: "{{ ansible_hostname }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          uptime_seconds: "{{ ansible_uptime_seconds | default('unknown') }}"
          cpu_cores: "{{ ansible_processor_vcpus | default('unknown') }}"
          memory_total_mb: "{{ ansible_memtotal_mb }}"
          memory_used_percent: "{{ mem_used_percent }}"
          filesystem: "{{ filesystem }}"
          disk_total_gb: "{{ disk_total_gb }}"
          disk_free_gb: "{{ disk_free_gb }}"
          disk_used_percent: "{{ disk_used_percent }}"
          disk_warn_threshold: "{{ disk_warn_percent }}"
          mem_warn_threshold: "{{ mem_warn_percent }}"
          health_verdict: "{{ health_verdict }}"
        aggregate: false
